# Одноцветный светодиод (output.mono_led)

substitutions:
  number: 1
  pin:
    # null тут для того, чтобы не было варнинга про то,
    # что в exposed_mono_led не определена переменная pin.number,
    # и при этом не задавать настоящий пин
    number: null
  exposed: false

  exposed_mono_led:
    text_sensor:
      # Номер пина
      - platform: template
        name: "[ext] mono_led_${number}.pin"
        icon: mdi:connection
        entity_category: diagnostic
        lambda: 'return {"${pin.number}"};'

output:
  # Одноцветный светодиод
  - platform: ledc
    id: mono_led_${number}
    pin: ${pin}

packages:
  # Публиковать расширенную информацию только по запросу
  exposed: ${ exposed_mono_led if exposed else {} }
