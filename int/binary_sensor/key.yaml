# Ключ (binary_sensor.key)

substitutions:
  number: 1
  pin:
    # null тут для того, чтобы не было варнинга про то,
    # что в exposed_key не определена переменная pin.number,
    # и при этом не задавать настоящий пин
    number: null
  debounce_delay: 30ms
  exposed: false

  exposed_key:
    text_sensor:
      # Номер пина
      - platform: template
        name: "[ext] key_${number}.pin"
        icon: mdi:connection
        entity_category: diagnostic
        lambda: 'return {"${pin.number}"};'

binary_sensor:
  # Ключ
  - platform: gpio
    id: key_${number}
    pin: ${pin}
    filters:
      - delayed_on: ${debounce_delay}

packages:
  # Публиковать расширенную информацию только по запросу
  exposed: ${ exposed_key if exposed else {} }
