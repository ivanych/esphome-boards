# S1V3 (ESP32 NodeMCU-32S)
# https://www.espboards.dev/esp32/nodemcu-32s/
#
#
# Управляемые объекты:
#   - Одноцветный светодиод (обычный)   (output.mono_led)
#   - Ключ (кнопка)                     (binary_sensor.key)
# Неуправляемые объекты:
#   - нет
# + разные пины

substitutions:
  friendly_board_name: "S1V3"

esp32:
  variant: esp32
  framework:
    type: esp-idf

packages:
  # Одноцветный светодиод
  mono_led: !include
    file: int/output/mono_led.yaml
    vars:
      pin:
        number: 2
        ignore_strapping_warning: true

  # Ключ (кнопка)
  button: !include
    file: int/binary_sensor/key.yaml
    vars:
      pin:
        number: 0
        inverted: true
        ignore_strapping_warning: true
