# Пульсометр (sensor.pulsometer + _total)

substitutions:
  number: 1
  pin:
    # null тут для того, чтобы не было варнинга про то,
    # что в exposed_pulse_meter не определена переменная pin.number,
    # и при этом не задавать настоящий пин
    number: null
  debounce_delay: 30ms
  exposed: false

  exposed_pulsometer:
    text_sensor:
      # Номер пина
      - platform: template
        name: "[ext] pulsometer_${number}.pin"
        icon: mdi:connection
        entity_category: diagnostic
        lambda: 'return {"${pin.number}"};'

text_sensor:
  # Время задержки для устранения дребезга модуля фотодиода
  - platform: template
    name: "Debounce Delay"
    icon: mdi:pulse
    update_interval: 1d
    lambda: |-
      return {"$debounce_delay"};
    entity_category: diagnostic

sensor:
  # Пульсометр
  - platform: pulse_meter
    id: pulsometer_${number}
    pin: ${pin}
    icon: mdi:speedometer
    # Единица измерения по умолчанию
    unit_of_measurement: "pulses/min"
    state_class: measurement

    # Время задержки для устранения дребезга модуля фотодиода
    # Фотодиод дребезжит при медленном увеличении потока света (если рукой подносить фонарик)
    # Диод на электросчётчике вспыхивает быстро и дребезг не возникает, но для успокоения совести сделаем антидребезг
    internal_filter: ${debounce_delay}

    # Значение по умолчанию edge, но в таком режиме импульс почему-то засчитывается дважды
    # Нормально считает только в режиме pulse.
    # Хм, с включение подтягивающего резистора edge начал считать нормально.
    internal_filter_mode: edge

    # Счётчик импульсов
    total:
      # Название по умолчанию
      name: "Pulses"
      id: pulsometer_${number}_total
      icon: mdi:counter
      state_class: total_increasing

packages:
  # Публиковать расширенную информацию только по запросу
  exposed: ${ exposed_pulsometer if exposed else {} }
