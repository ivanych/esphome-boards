# Индикатор (light_indicator)
# Бинарный светодиод

substitutions:
  number: 1
  pin:
    # null тут для того, чтобы не было варнинга про то,
    # что в exposed_light_indicator не определена переменная pin.number,
    # и при этом не задавать настоящий пин
    number: null
  exposed: false

  exposed_light_indicator:
    text_sensor:
      # Номер пина, на котором работает индикатор
      - platform: template
        name: "[ext] light_indicator_${number}.pin"
        icon: mdi:connection
        entity_category: diagnostic
        lambda: 'return {"${pin.number}"};'

light:
  # Бинарный светодиод
  - platform: binary
    id: light_indicator_${number}
    output: output_light_indicator_${number}

output:
  # Выходной пин
  - platform: gpio
    id: output_light_indicator_${number}
    pin: ${pin}

packages:
  # Публиковать расширенную информацию только по запросу
  exposed: ${ exposed_light_indicator if exposed else {} }
